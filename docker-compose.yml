services:
  life-timer:
    image: life-timer
    build:
      context: .
    container_name: life-timer
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "3425:3100"
    env_file:
      - .env.local
    restart: unless-stopped

networks:
  default:
    driver: bridge
    enable_ipv6: true
